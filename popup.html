<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B站学习模式守护</title>
    <link rel="stylesheet" href="ui/tokens.css" />
    <link rel="stylesheet" href="ui/base.css" />
    <link rel="stylesheet" href="ui/popup.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>学习守护</h1>

      <div class="section">
        <p class="section-label">判定模式</p>
        <div class="feature">
          <select id="quickMode" class="mode-select">
            <option value="weak">弱模式（黑名单）</option>
            <option value="strong">强模式（白名单）</option>
            <option value="ai">AI模式</option>
          </select>
        </div>
      </div>

      <div class="section">
        <p class="section-label">拦截动作</p>
        <div class="feature">
          <span class="name">拦截视频</span>
          <label class="switch">
            <input type="checkbox" data-key="actionBlockVideo" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="feature">
          <span class="name">隐藏封面</span>
          <label class="switch">
            <input type="checkbox" data-key="actionHideCover" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="feature">
          <span class="name">自动不感兴趣</span>
          <label class="switch">
            <input type="checkbox" data-key="autoNotInterestedEnabled" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section">
        <p class="section-label">增强</p>
        <div class="feature">
          <span class="name">时段策略</span>
          <label class="switch">
            <input type="checkbox" data-key="timeStrategyEnabled" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="feature">
          <span class="name">专注密码锁</span>
          <label class="switch">
            <input type="checkbox" data-key="focusLockEnabled" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section">
        <p class="section-label">主题</p>
        <div class="theme-switch" id="themeSwitch">
          <label class="theme-option">
            <input type="radio" name="uiTheme" value="auto" />
            <span>跟随系统</span>
          </label>
          <label class="theme-option">
            <input type="radio" name="uiTheme" value="light" />
            <span>亮色</span>
          </label>
          <label class="theme-option">
            <input type="radio" name="uiTheme" value="dark" />
            <span>暗色</span>
          </label>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="openOptions">详细设置</button>
        <button id="reset">恢复默认</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <script src="ui/theme.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
