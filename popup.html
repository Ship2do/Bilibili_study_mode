<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B站学习模式守护</title>
    <style>
      :root {
        --bg: #0c0a0a;
        --panel: #141010;
        --text: #e8d0d0;
        --sub: #997777;
        --line: #2a1515;
        --brand: #cc1111;
        --brand-border: #ff3333;
        --pixel: 'Courier New', 'Consolas', monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0; width: 320px;
        background: var(--bg); color: var(--text);
        font-family: var(--pixel); font-size: 13px;
      }

      .wrap { padding: 16px 14px; }

      h1 {
        margin: 0 0 14px; font-size: 18px; font-weight: 900;
        color: #ff3333; text-transform: uppercase; letter-spacing: 3px;
        text-shadow: 2px 2px 0 #000;
        text-align: center;
      }

      .section {
        margin-bottom: 12px; padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }
      .section:last-of-type { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }

      .section-label {
        margin: 0 0 8px; font-size: 11px; font-weight: 700;
        color: #ff6666; text-transform: uppercase; letter-spacing: 2px;
      }

      .feature {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; padding: 6px 0;
      }

      .name { font-size: 13px; font-weight: 700; color: #ddaaaa; }

      .mode-select {
        width: 150px;
        border: 2px solid #331818; border-radius: 0;
        padding: 6px 8px; font-size: 12px;
        background: #0e0808; color: var(--text);
        font-family: var(--pixel);
      }
      .mode-select:focus {
        outline: none; border-color: #663333;
      }

      .switch {
        width: 42px; height: 22px; position: relative; flex: 0 0 auto;
      }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; inset: 0;
        background: #2a1515; cursor: pointer; transition: 0.15s;
        border: 1px solid #442222;
      }
      .slider::before {
        content: ""; position: absolute;
        width: 16px; height: 16px; left: 2px; top: 2px;
        background: #886666; transition: 0.15s;
      }
      input:checked + .slider { background: #cc1111; border-color: #ff4444; }
      input:checked + .slider::before {
        transform: translateX(20px); background: #fff;
      }

      .actions {
        margin-top: 14px; display: grid;
        grid-template-columns: 1fr 1fr; gap: 8px;
      }

      button {
        border: 2px solid #442222; border-radius: 0;
        padding: 8px 10px; background: #1a0e0e; color: #ddaaaa;
        font-size: 12px; font-weight: 700; cursor: pointer;
        font-family: var(--pixel); letter-spacing: 1px;
        text-transform: uppercase;
      }
      button:hover { background: #2a1414; border-color: #663333; }
      button:active { transform: translate(1px, 1px); }

      button.primary {
        border-color: var(--brand-border);
        background: var(--brand); color: #fff;
        box-shadow: 3px 3px 0 #000;
      }
      button.primary:hover { background: #dd2222; }

      .status {
        margin-top: 10px; min-height: 18px;
        color: #775555; font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>学习守护</h1>

      <div class="section">
        <p class="section-label">判定模式</p>
        <div class="feature">
          <select id="quickMode" class="mode-select">
            <option value="weak">弱模式（黑名单）</option>
            <option value="strong">强模式（白名单）</option>
            <option value="ai">AI模式</option>
          </select>
        </div>
      </div>

      <div class="section">
        <p class="section-label">拦截动作</p>
        <div class="feature">
          <span class="name">拦截视频</span>
          <label class="switch">
            <input type="checkbox" data-key="actionBlockVideo" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="feature">
          <span class="name">隐藏封面</span>
          <label class="switch">
            <input type="checkbox" data-key="actionHideCover" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="feature">
          <span class="name">自动不感兴趣</span>
          <label class="switch">
            <input type="checkbox" data-key="autoNotInterestedEnabled" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="section">
        <p class="section-label">增强</p>
        <div class="feature">
          <span class="name">时段策略</span>
          <label class="switch">
            <input type="checkbox" data-key="timeStrategyEnabled" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="feature">
          <span class="name">专注密码锁</span>
          <label class="switch">
            <input type="checkbox" data-key="focusLockEnabled" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="openOptions">详细设置</button>
        <button id="reset">恢复默认</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
