<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B站学习模式守护 - 设置</title>
    <link rel="stylesheet" href="ui/tokens.css" />
    <link rel="stylesheet" href="ui/base.css" />
    <link rel="stylesheet" href="ui/options.css" />
  </head>
  <body>
    <main class="page">
      <h1>学习模式守护</h1>
      <p class="intro">配置判定模式、动作、AI Prompt、拦截界面、时段策略和密码锁。</p>

      <section class="panel">
        <!-- 判定模式与动作 -->
        <div class="section">
          <h2 class="section-title">判定模式</h2>
          <div class="mode-grid item">
            <label class="mode-card">
              <span class="row">
                <input id="modeWeak" name="mode" type="radio" value="weak" />
                <span class="mode-title">弱模式</span>
              </span>
              <span class="mode-note">匹配屏蔽词即拦截</span>
            </label>
            <label class="mode-card">
              <span class="row">
                <input id="modeStrong" name="mode" type="radio" value="strong" />
                <span class="mode-title">强模式</span>
              </span>
              <span class="mode-note">未命中学习词即拦截</span>
            </label>
            <label class="mode-card">
              <span class="row">
                <input id="modeAi" name="mode" type="radio" value="ai" />
                <span class="mode-title">AI模式</span>
              </span>
              <span class="mode-note">AI判定娱乐向即拦截</span>
            </label>
          </div>
        </div>

        <!-- 动作 -->
        <div class="section">
          <h2 class="section-title">拦截动作</h2>
          <div class="item">
            <label class="row">
              <input id="actionBlockVideo" type="checkbox" />
              <span>
                拦截视频
                <span class="tip">ⓘ<span class="tip-text">进入视频页时显示拦截页面</span></span>
              </span>
            </label>
          </div>
          <div class="item">
            <label class="row">
              <input id="actionHideCover" type="checkbox" />
              <span>
                隐藏封面
                <span class="tip">ⓘ<span class="tip-text">在首页/推荐/搜索流中隐藏卡片封面</span></span>
              </span>
            </label>
          </div>
          <div class="item">
            <label class="row">
              <input id="autoNotInterestedEnabled" type="checkbox" />
              <span>
                自动不感兴趣
                <span class="tip">ⓘ<span class="tip-text">尽力执行，页面结构变化时可能偶发失效</span></span>
              </span>
            </label>
          </div>
        </div>

        <!-- 外观 -->
        <div class="section">
          <h2 class="section-title">外观</h2>
          <div class="grid3">
            <div class="item">
              <label class="label" for="uiTheme">主题</label>
              <select id="uiTheme">
                <option value="auto">跟随系统</option>
                <option value="light">亮色</option>
                <option value="dark">暗色</option>
              </select>
            </div>
            <div class="item">
              <label class="label" for="uiFont">字体</label>
              <select id="uiFont">
                <option value="system">系统默认</option>
                <option value="serif">衬线</option>
                <option value="mono">等宽</option>
              </select>
            </div>
            <div class="item">
              <label class="label" for="uiRadius">圆角</label>
              <select id="uiRadius">
                <option value="sharp">直角</option>
                <option value="soft">适中</option>
                <option value="round">圆润</option>
              </select>
            </div>
          </div>
          <div class="item">
            <label class="label">
              强调色
              <span class="tip">ⓘ<span class="tip-text">同时作用于设置页、弹出面板和拦截界面</span></span>
            </label>
            <div class="accent-row" id="accentRow"></div>
          </div>
          <p class="hint">外观设置属于纯样式，即使开启了专注密码锁也可以随时修改。</p>
        </div>

        <!-- 拦截界面横幅 -->
        <div class="section">
          <h2 class="section-title">拦截界面横幅</h2>
          <div class="item">
            <label class="row">
              <input id="blockBannerEnabled" type="checkbox" />
              <span>显示红色警示横幅</span>
            </label>
          </div>
          <div class="item">
            <label class="label" for="blockBannerText">横幅字样</label>
            <input id="blockBannerText" type="text" placeholder="学习！" maxlength="20" />
            <div class="banner-preview" id="bannerPreview">学习！</div>
          </div>
        </div>

        <!-- 关键词库 -->
        <div class="section">
          <h2 class="section-title">关键词库</h2>
          <div class="item">
            <label class="label">
              学习关键词（白名单）
              <span class="tip">ⓘ<span class="tip-text">强模式基于它做放行判定，输入后回车添加</span></span>
            </label>
            <div class="chips-wrap" id="allowChips">
              <input class="chip-input" id="allowChipInput" placeholder="输入关键词后回车..." />
            </div>
          </div>
          <div class="item">
            <label class="label">
              屏蔽关键词（黑名单）
              <span class="tip">ⓘ<span class="tip-text">弱模式与AI前置过滤基于它做拦截判定</span></span>
            </label>
            <div class="chips-wrap" id="blockChips">
              <input class="chip-input" id="blockChipInput" placeholder="输入关键词后回车..." />
            </div>
          </div>
        </div>

        <!-- AI 判定 -->
        <div class="section">
          <h2 class="section-title">AI 判定</h2>
          <div class="item">
            <label class="row">
              <input id="aiPreFilterBlockKeywords" type="checkbox" />
              <span>
                AI先走屏蔽词过滤
                <span class="tip">ⓘ<span class="tip-text">命中黑名单直接拦截，不调用AI</span></span>
              </span>
            </label>
          </div>
          <div class="grid2">
            <div class="item">
              <label class="label" for="aiApiUrl">API URL</label>
              <input id="aiApiUrl" type="text" placeholder="https://api.deepseek.com" />
              <p class="hint" id="aiPermissionHint"></p>
            </div>
            <div class="item">
              <label class="label" for="aiModel">Model</label>
              <input id="aiModel" type="text" placeholder="deepseek-v4-flash" />
            </div>
            <div class="item">
              <label class="label" for="aiApiKey">API Key</label>
              <input id="aiApiKey" type="password" placeholder="sk-..." />
            </div>
            <div class="item">
              <label class="label" for="aiRequestTimeoutMs">
                超时（ms）
                <span class="tip">ⓘ<span class="tip-text">AI请求超时时间，3000-30000毫秒</span></span>
              </label>
              <input id="aiRequestTimeoutMs" type="number" min="3000" max="30000" step="1000" />
            </div>
          </div>
          <div class="item">
            <label class="label" for="aiPrompt">Prompt 模板</label>
            <div class="placeholder-buttons" id="placeholderButtons">
              <span class="placeholder-label">插入：</span>
            </div>
            <textarea id="aiPrompt"></textarea>
          </div>
        </div>

        <!-- 时段策略 -->
        <div class="section">
          <h2 class="section-title">时段策略</h2>
          <div class="item">
            <label class="row">
              <input id="timeStrategyEnabled" type="checkbox" />
              <span>启用时段策略</span>
            </label>
          </div>
          <div class="top-actions">
            <button id="addTimeRule" type="button">新增规则</button>
          </div>
          <div id="timeRulesContainer"></div>
          <p class="hint">支持跨天（如 22:00-06:00）。优先级：完全禁止 > 自定义；同级按列表顺序。</p>
        </div>

        <!-- 密码锁 -->
        <div class="section">
          <h2 class="section-title">专注密码锁</h2>
          <div class="item">
            <label class="row">
              <input id="focusLockEnabled" type="checkbox" />
              <span>
                启用密码锁
                <span class="tip">ⓘ<span class="tip-text">降低专注度的操作需要密码验证</span></span>
              </span>
            </label>
          </div>
          <div class="grid3">
            <div class="item">
              <label class="label" for="newPassword">设置/更新密码</label>
              <input id="newPassword" type="password" placeholder="留空不修改" />
            </div>
            <div class="item">
              <label class="label" for="confirmPassword">确认密码</label>
              <input id="confirmPassword" type="password" placeholder="再次输入" />
            </div>
            <div class="item">
              <label class="label" for="unlockPassword">当前密码</label>
              <input id="unlockPassword" type="password" placeholder="降级时需要" />
            </div>
          </div>
          <p class="warn">建议让他人设置密码且不告诉你，专注效果更稳。</p>
        </div>

        <div class="actions">
          <button class="primary" id="save">保存设置</button>
          <button id="reset">恢复默认</button>
        </div>
        <div class="status" id="status"></div>
      </section>
    </main>

    <script src="shared/constants.js"></script>
    <script src="ui/theme.js"></script>
    <script src="options.js"></script>
  </body>
</html>
