<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>B站学习模式守护 - 设置</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --panel: #22223a;
        --text: #d0d0e8;
        --sub: #8888aa;
        --line: #333355;
        --line-soft: #2a2a48;
        --brand: #cc2222;
        --brand-border: #ff4444;
        --brand-glow: rgba(220, 38, 38, 0.15);
        --warn-bg: #2a2210;
        --warn-border: #886622;
        --chip-bg: #2e2e50;
        --chip-border: #555577;
        --chip-hover: #cc2222;
        --input-bg: #16162a;
        --input-border: #3a3a5c;
        --pixel: 'Courier New', 'Consolas', monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: var(--pixel); font-size: 13px;
      }

      .page { max-width: 880px; margin: 0 auto; padding: 24px 20px 60px; }

      h1 {
        margin: 0 0 6px; font-size: 26px; font-weight: 900;
        color: #ff4444; text-transform: uppercase; letter-spacing: 4px;
        text-shadow: 2px 2px 0 #000;
      }

      .intro { margin: 0 0 20px; color: var(--sub); line-height: 1.7; font-size: 12px; }

      .panel {
        background: var(--panel);
        border: 2px solid #444466;
        padding: 20px;
      }

      .section {
        margin-bottom: 18px; padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .section:last-of-type { margin-bottom: 0; padding-bottom: 0; border-bottom: 0; }

      .section-title {
        margin: 0 0 10px; font-size: 15px; font-weight: 900;
        color: #ff6666; text-transform: uppercase; letter-spacing: 2px;
      }

      .desc {
        margin: 0 0 10px; color: var(--sub);
        font-size: 11px; line-height: 1.7;
      }

      .item { margin-bottom: 12px; }
      .item:last-child { margin-bottom: 0; }

      .row { display: flex; align-items: center; gap: 8px; }

      .label {
        display: block; margin: 0 0 6px;
        font-size: 13px; font-weight: 700; color: #bbbbdd;
      }

      .tip {
        position: relative; cursor: help;
        border-bottom: 1px dashed #555577;
      }
      .tip .tip-text {
        visibility: hidden; opacity: 0;
        position: absolute; left: 0; top: 100%;
        background: #2a2a48; border: 1px solid #555577;
        color: #aaaacc; font-size: 11px; line-height: 1.6;
        padding: 8px 10px; min-width: 220px; max-width: 340px;
        z-index: 100; pointer-events: none;
        transition: opacity 0.15s;
        box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      }
      .tip:hover .tip-text { visibility: visible; opacity: 1; }

      .hint {
        margin: 6px 0 0; color: #666688;
        font-size: 11px; line-height: 1.6;
      }

      textarea, input[type="text"], input[type="password"],
      input[type="number"], input[type="time"], select {
        width: 100%; box-sizing: border-box;
        border: 2px solid var(--input-border); border-radius: 0;
        padding: 9px 10px; font-size: 13px; line-height: 1.4;
        background: var(--input-bg); color: var(--text);
        font-family: var(--pixel);
      }
      textarea:focus, input:focus, select:focus {
        outline: none; border-color: #7777aa;
        box-shadow: 0 0 0 1px rgba(120,120,180,0.2);
      }

      textarea { min-height: 100px; resize: vertical; }

      input[type="checkbox"], input[type="radio"] {
        width: 16px; height: 16px; accent-color: #cc2222;
      }

      .grid2 { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
      .grid3 { display: grid; gap: 10px; grid-template-columns: 1fr 1fr 1fr; }

      .mode-grid { display: grid; gap: 8px; grid-template-columns: 1fr 1fr 1fr; }

      .mode-card {
        border: 2px solid #3a3a5c; padding: 10px;
        background: var(--input-bg); display: flex; flex-direction: column; gap: 5px;
        transition: border-color 0.15s;
      }
      .mode-card:hover { border-color: #6666aa; }
      .mode-card:has(input:checked) { border-color: #cc2222; background: #221122; }

      .mode-title { font-size: 13px; font-weight: 700; color: #bbbbdd; }
      .mode-note { color: #7777aa; font-size: 11px; line-height: 1.6; }

      .time-rule {
        border: 2px solid #3a3a5c; padding: 12px; margin-bottom: 10px;
        background: var(--input-bg);
      }
      .time-rule:last-child { margin-bottom: 0; }

      .days { display: flex; flex-wrap: wrap; gap: 8px 10px; }
      .day { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: #8888aa; }

      .rule-actions { margin-top: 8px; display: flex; justify-content: flex-end; }
      .rule-actions button {
        border: 1px solid #555577; background: #2a2a48; color: #aaaacc;
      }

      .top-actions { margin-bottom: 10px; }

      .actions { margin-top: 18px; display: flex; gap: 10px; }

      button {
        border: 2px solid #555577; border-radius: 0;
        padding: 10px 16px; background: #2a2a48; color: #bbbbdd;
        font-size: 13px; font-weight: 700; cursor: pointer;
        font-family: var(--pixel); letter-spacing: 1px;
        text-transform: uppercase;
      }
      button:hover { background: #3a3a5c; border-color: #7777aa; }
      button:active { transform: translate(1px, 1px); }

      button.primary {
        border-color: var(--brand-border);
        background: var(--brand); color: #fff;
        box-shadow: 3px 3px 0 #000;
      }
      button.primary:hover { background: #dd3333; }

      .status { margin-top: 12px; min-height: 22px; color: #7777aa; font-size: 12px; }

      .warn {
        margin: 8px 0 0; color: #ccaa44;
        background: var(--warn-bg); border: 1px solid var(--warn-border);
        padding: 8px 10px; font-size: 11px; line-height: 1.6;
      }

      /* Keyword chips */
      .chips-wrap {
        display: flex; flex-wrap: wrap; gap: 6px;
        padding: 8px; min-height: 42px;
        border: 2px solid var(--input-border);
        background: var(--input-bg);
        cursor: text;
      }
      .chips-wrap:focus-within {
        border-color: #7777aa;
        box-shadow: 0 0 0 1px rgba(120,120,180,0.2);
      }
      .chip {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 3px 8px;
        background: var(--chip-bg); border: 1px solid var(--chip-border);
        font-size: 12px; color: #ccccdd;
        font-family: var(--pixel);
        transition: border-color 0.1s;
      }
      .chip:hover { border-color: var(--chip-hover); }
      .chip .chip-x {
        display: none; cursor: pointer; font-size: 11px; font-weight: 900;
        color: #ff6666; margin-left: 2px; line-height: 1;
      }
      .chip:hover .chip-x { display: inline; }
      .chip .chip-x:hover { color: #ff3333; }
      .chip-input {
        border: none; outline: none; background: transparent;
        color: var(--text); font-family: var(--pixel); font-size: 12px;
        min-width: 60px; flex: 1; padding: 2px 0;
      }

      .placeholder-buttons {
        display: flex; flex-wrap: wrap; gap: 6px;
        align-items: center; margin-bottom: 6px;
      }
      .placeholder-label { font-size: 12px; color: var(--sub); }
      .placeholder-btn {
        border: 1px solid #555577; border-radius: 0;
        padding: 3px 10px; background: #2a2a48;
        color: #aaaacc; font-size: 11px; cursor: pointer;
        font-family: var(--pixel);
        transition: background 0.1s;
      }
      .placeholder-btn:hover { background: #3a3a5c; border-color: #7777aa; }

      .custom-overrides {
        border-top: 1px dashed #3a3a5c;
        padding-top: 10px; margin-top: 10px;
      }

      .banner-preview {
        margin: 8px 0; padding: 12px;
        background: #1a1a30; border: 2px solid #444466;
        text-align: center; overflow: hidden;
        font-size: 16px; font-weight: 900; color: #ff4444;
        text-shadow: 2px 2px 0 #000;
        letter-spacing: 4px; text-transform: uppercase;
      }

      @media (max-width: 860px) {
        .grid2, .grid3, .mode-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>学习模式守护</h1>
      <p class="intro">配置判定模式、动作、AI Prompt、拦截界面、时段策略和密码锁。</p>

      <section class="panel">
        <!-- 判定模式与动作 -->
        <div class="section">
          <h2 class="section-title">判定模式</h2>
          <div class="mode-grid item">
            <label class="mode-card">
              <span class="row">
                <input id="modeWeak" name="mode" type="radio" value="weak" />
                <span class="mode-title">弱模式</span>
              </span>
              <span class="mode-note">匹配屏蔽词即拦截</span>
            </label>
            <label class="mode-card">
              <span class="row">
                <input id="modeStrong" name="mode" type="radio" value="strong" />
                <span class="mode-title">强模式</span>
              </span>
              <span class="mode-note">未命中学习词即拦截</span>
            </label>
            <label class="mode-card">
              <span class="row">
                <input id="modeAi" name="mode" type="radio" value="ai" />
                <span class="mode-title">AI模式</span>
              </span>
              <span class="mode-note">AI判定娱乐向即拦截</span>
            </label>
          </div>
        </div>

        <!-- 动作 -->
        <div class="section">
          <h2 class="section-title">拦截动作</h2>
          <div class="item">
            <label class="row">
              <input id="actionBlockVideo" type="checkbox" />
              <span>
                拦截视频
                <span class="tip">ⓘ<span class="tip-text">进入视频页时显示拦截页面</span></span>
              </span>
            </label>
          </div>
          <div class="item">
            <label class="row">
              <input id="actionHideCover" type="checkbox" />
              <span>
                隐藏封面
                <span class="tip">ⓘ<span class="tip-text">在首页/推荐/搜索流中隐藏卡片封面</span></span>
              </span>
            </label>
          </div>
          <div class="item">
            <label class="row">
              <input id="autoNotInterestedEnabled" type="checkbox" />
              <span>
                自动不感兴趣
                <span class="tip">ⓘ<span class="tip-text">尽力执行，页面结构变化时可能偶发失效</span></span>
              </span>
            </label>
          </div>
        </div>

        <!-- 拦截界面横幅 -->
        <div class="section">
          <h2 class="section-title">拦截界面横幅</h2>
          <div class="item">
            <label class="row">
              <input id="blockBannerEnabled" type="checkbox" />
              <span>显示红色警示横幅</span>
            </label>
          </div>
          <div class="item">
            <label class="label" for="blockBannerText">横幅字样</label>
            <input id="blockBannerText" type="text" placeholder="学习！" maxlength="20" />
            <div class="banner-preview" id="bannerPreview">学习！</div>
          </div>
        </div>

        <!-- 关键词库 -->
        <div class="section">
          <h2 class="section-title">关键词库</h2>
          <div class="item">
            <label class="label">
              学习关键词（白名单）
              <span class="tip">ⓘ<span class="tip-text">强模式基于它做放行判定，输入后回车添加</span></span>
            </label>
            <div class="chips-wrap" id="allowChips">
              <input class="chip-input" id="allowChipInput" placeholder="输入关键词后回车..." />
            </div>
          </div>
          <div class="item">
            <label class="label">
              屏蔽关键词（黑名单）
              <span class="tip">ⓘ<span class="tip-text">弱模式与AI前置过滤基于它做拦截判定</span></span>
            </label>
            <div class="chips-wrap" id="blockChips">
              <input class="chip-input" id="blockChipInput" placeholder="输入关键词后回车..." />
            </div>
          </div>
        </div>

        <!-- AI 判定 -->
        <div class="section">
          <h2 class="section-title">AI 判定</h2>
          <div class="item">
            <label class="row">
              <input id="aiPreFilterBlockKeywords" type="checkbox" />
              <span>
                AI先走屏蔽词过滤
                <span class="tip">ⓘ<span class="tip-text">命中黑名单直接拦截，不调用AI</span></span>
              </span>
            </label>
          </div>
          <div class="grid2">
            <div class="item">
              <label class="label" for="aiApiUrl">API URL</label>
              <input id="aiApiUrl" type="text" placeholder="https://api.deepseek.com" />
            </div>
            <div class="item">
              <label class="label" for="aiModel">Model</label>
              <input id="aiModel" type="text" placeholder="deepseek-v4-flash" />
            </div>
            <div class="item">
              <label class="label" for="aiApiKey">API Key</label>
              <input id="aiApiKey" type="password" placeholder="sk-..." />
            </div>
            <div class="item">
              <label class="label" for="aiRequestTimeoutMs">
                超时（ms）
                <span class="tip">ⓘ<span class="tip-text">AI请求超时时间，3000-30000毫秒</span></span>
              </label>
              <input id="aiRequestTimeoutMs" type="number" min="3000" max="30000" step="1000" />
            </div>
          </div>
          <div class="item">
            <label class="label" for="aiPrompt">Prompt 模板</label>
            <div class="placeholder-buttons" id="placeholderButtons">
              <span class="placeholder-label">插入：</span>
            </div>
            <textarea id="aiPrompt"></textarea>
          </div>
        </div>

        <!-- 时段策略 -->
        <div class="section">
          <h2 class="section-title">时段策略</h2>
          <div class="item">
            <label class="row">
              <input id="timeStrategyEnabled" type="checkbox" />
              <span>启用时段策略</span>
            </label>
          </div>
          <div class="top-actions">
            <button id="addTimeRule" type="button">新增规则</button>
          </div>
          <div id="timeRulesContainer"></div>
          <p class="hint">支持跨天（如 22:00-06:00）。优先级：完全禁止 > 自定义；同级按列表顺序。</p>
        </div>

        <!-- 密码锁 -->
        <div class="section">
          <h2 class="section-title">专注密码锁</h2>
          <div class="item">
            <label class="row">
              <input id="focusLockEnabled" type="checkbox" />
              <span>
                启用密码锁
                <span class="tip">ⓘ<span class="tip-text">降低专注度的操作需要密码验证</span></span>
              </span>
            </label>
          </div>
          <div class="grid3">
            <div class="item">
              <label class="label" for="newPassword">设置/更新密码</label>
              <input id="newPassword" type="password" placeholder="留空不修改" />
            </div>
            <div class="item">
              <label class="label" for="confirmPassword">确认密码</label>
              <input id="confirmPassword" type="password" placeholder="再次输入" />
            </div>
            <div class="item">
              <label class="label" for="unlockPassword">当前密码</label>
              <input id="unlockPassword" type="password" placeholder="降级时需要" />
            </div>
          </div>
          <p class="warn">建议让他人设置密码且不告诉你，专注效果更稳。</p>
        </div>

        <div class="actions">
          <button class="primary" id="save">保存设置</button>
          <button id="reset">恢复默认</button>
        </div>
        <div class="status" id="status"></div>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
